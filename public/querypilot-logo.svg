<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 125 960 970" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="qp-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="qp-title">QueryPilot</title>
  <style>
    .qp-fill { fill: var(--logo-color, #ffffff); }
    .qp-line { stroke: var(--logo-color, #ffffff); fill: none; stroke-width: 26; }
    .qp-round { stroke: var(--logo-color, #ffffff); stroke-width: 22; stroke-linejoin: round; }
  </style>

  <!-- Q ring with gap for the cursor -->
  <path class="qp-fill" d="M1054.1 806.5 A471 455 0 1 0 783.4 1021.7 L738.3 927.8 A366 353 0 1 1 957.7 767.2 Z"/>

  <!-- Input nodes -->
  <circle class="qp-fill" cx="471" cy="428" r="54"/>
  <circle class="qp-fill" cx="447" cy="593" r="54"/>
  <circle class="qp-fill" cx="471" cy="747" r="54"/>

  <!-- Connectors merging into the output node -->
  <path class="qp-line" d="M525 436 C610 432 622 512 664 556 C700 588 722 592 752 592"/>
  <path class="qp-line" d="M501 593 H752"/>
  <path class="qp-line" d="M525 745 C610 749 622 669 664 625 C700 593 722 594 752 594"/>

  <!-- Output node -->
  <circle class="qp-fill" cx="843" cy="594" r="93"/>

  <!-- Cursor arrow -->
  <path class="qp-fill qp-round" d="M726 748 L1093 886 L956 937 L890 1072 Z"/>
</svg>
